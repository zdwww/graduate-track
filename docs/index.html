<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraduateTrack</title>
    <!-- Also what a link unfurl scrapes, so it is what shows up when the site URL is
         pasted into the submission form or a chat. -->
    <meta
      name="description"
      content="Track every graduate application in one place — browse programs and deadlines, follow each application's status, and keep the people you have contacted alongside the application they belong to."
    />
    <!-- Resolve the saved theme before first paint. React mounts too late: without
         this the page renders in the light palette for a frame and then flips. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var resolved =
            saved === "light" || saved === "dark"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
